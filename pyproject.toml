[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apkfs"
dynamic = ["version"]
authors = [
  { name = "Xforceindia", email = "xforceindia@users.noreply.github.com" }
]

description = "Smali Patcher ( Bypass 𒁍 SSL & Flutter SSL, VPN, USB Debugging, Screen Restrict, One Device Login, Spoof Info & Package Detection, Ads, AES Logs Inject, TG Patch, Pine HooK )"

license = { text = "MIT" }
readme = "README.md"

requires-python = ">=3.10"

dependencies = [
  "requests",
  "r2pipe",
  "asn1crypto",
  "multiprocess"
]

keywords = ["apkfs"]

classifiers = [
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
]

[project.scripts]
apkfs = "apkfs.APK_PATCHER:apkfs_main"
ApkFS = "apkfs.APK_PATCHER:apkfs_main"

[tool.setuptools]
include-package-data = true

packages.find = {}

package-data = { apkfs = [
  "Utils/Files/AES.smali",
  "Utils/Files/Algorithm.dex",
  "Utils/Files/Hook.smali",
  "Utils/Files/lib_Pairip_CoreX.so",
  "Utils/Pine/config.json",
  "Utils/Pine/libpine32",
  "Utils/Pine/libpine64",
  "Utils/Pine/loader.dex"
] }


[project.urls]
Homepage = "https://github.com/Xforceindia/apkfs"
Repository = "https://github.com/Xforceindia/apkfs.git"
Issues = "https://github.com/Xforceindia/apkfs/issues"

[tool.setuptools.dynamic]
version = { file = "VERSION" }